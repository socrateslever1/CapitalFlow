name: CapitalFlow Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'main.tsx'
      - 'index.html'
      - 'App.tsx'
      - 'lib/**'
      - 'components/**'
      - 'pages/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'main.tsx'
      - 'index.html'
      - 'App.tsx'
      - 'lib/**'
      - 'components/**'
      - 'pages/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install locked dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Install Capacitor Android toolchain
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Validate architecture and financial invariants
        run: npm run test:quality
      - name: Build application bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Generate and synchronize native Android project
        run: |
          # Em CI esta pasta so contem documentacao; o projeto nativo e gerado a cada build.
          # Nao apagar arquivos locais do desenvolvedor: este comando roda apenas no runner descartavel.
          rm -rf android
          npx cap add android
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/manifest.json
      - name: Assemble Android debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Validate APK structure, signature and SHA-256
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t -q "$apk" >/dev/null
          unzip -Z -1 "$apk" | grep -qx "AndroidManifest.xml"
          unzip -Z -1 "$apk" | grep -Eq '^classes([0-9]+)?\.dex$'
          signer="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CapitalFlow-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
