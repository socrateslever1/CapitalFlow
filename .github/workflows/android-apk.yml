name: CapitalFlow Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'index.css'
      - 'brand.css'
      - 'features/**'
      - 'containers/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'layout/**'
      - 'services/**'
      - 'utils/**'
      - 'src/**'
      - 'assets/**'
      - 'types.ts'
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'main.tsx'
      - 'index.html'
      - 'App.tsx'
      - 'lib/**'
      - 'components/**'
      - 'pages/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'index.css'
      - 'brand.css'
      - 'features/**'
      - 'containers/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'layout/**'
      - 'services/**'
      - 'utils/**'
      - 'src/**'
      - 'assets/**'
      - 'types.ts'
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'main.tsx'
      - 'index.html'
      - 'App.tsx'
      - 'lib/**'
      - 'components/**'
      - 'pages/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: write  # Only main pushes may publish the public test release.

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install locked dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Install Capacitor Android toolchain
        run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Validate architecture and financial invariants
        run: npm run test:quality
      - name: Build application bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Generate and synchronize native Android project
        run: |
          # Em CI esta pasta so contem documentacao; o projeto nativo e gerado a cada build.
          # Nao apagar arquivos locais do desenvolvedor: este comando roda apenas no runner descartavel.
          rm -rf android
          npx cap add android
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/manifest.json
      - name: Assemble Android debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Validate APK structure, signature and SHA-256
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t -q "$apk" >/dev/null
          unzip -Z -1 "$apk" | grep -qx "AndroidManifest.xml"
          unzip -Z -1 "$apk" | grep -Eq '^classes([0-9]+)?\.dex$'
          signer="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CapitalFlow-Android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # Public fixed URL: unlike Actions artifacts, this link does not expire after 30 days.
      # Debug APK is a test build; a permanent release keystore remains a separate task.
      - name: Publish stable test APK to GitHub Releases
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-preview"
          mkdir -p /tmp/capitalflow-release
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/capitalflow-release/CapitalFlow-Android.apk
          (
            cd /tmp/capitalflow-release
            sha256sum CapitalFlow-Android.apk > CapitalFlow-Android.apk.sha256
          )
          cat > /tmp/capitalflow-release-notes.md <<EOF
          CapitalFlow para Android — versão de teste.

          Compilado a partir do commit: ${GITHUB_SHA}

          Aviso: pacote debug destinado a testes, sem assinatura permanente de distribuição.
          Se o Android informar "App não instalado", verifique conflitos com uma instalação
          anterior. Não utilize esta versão para operações financeiras críticas.
          EOF

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "CapitalFlow Android — teste" --prerelease \
              --notes-file /tmp/capitalflow-release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            /tmp/capitalflow-release/CapitalFlow-Android.apk \
            /tmp/capitalflow-release/CapitalFlow-Android.apk.sha256
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "CapitalFlow Android — teste" --prerelease \
            --notes-file /tmp/capitalflow-release-notes.md

      # Release signing MUST use the same owner-managed keystore for every version.
      # GitHub-hosted runners generate a different debug certificate each time.
      - name: Check permanent Android signing credentials
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        id: signing
        shell: bash
        env:
          CF_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          CF_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$CF_KEYSTORE_B64" && -n "$CF_STORE_PASSWORD" && -n "$CF_KEY_ALIAS" && -n "$CF_KEY_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Assinatura de producao nao configurada. Defina os 4 segredos ANDROID_RELEASE_*. Nenhum APK sera publicado como assinado.'
          fi

      - name: Set monotonic versionCode for Android release
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path('android/app/build.gradle')
          source = path.read_text(encoding='utf-8')
          version_code = 100000 + int(os.environ['GITHUB_RUN_NUMBER'])
          updated, count = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$', lambda m: f'{m.group(1)}versionCode {version_code}', source)
          if count != 1:
              raise SystemExit('Expected exactly one Android versionCode in generated Gradle')
          updated, count = re.subn(r'(?m)^(\s*)versionName\s+"[^"]*"\s*$', lambda m: f'{m.group(1)}versionName "1.0.{os.environ["GITHUB_RUN_NUMBER"]}"', updated)
          if count != 1:
              raise SystemExit('Expected exactly one Android versionName in generated Gradle')
          path.write_text(updated, encoding='utf-8')
          print(f'Android release versionCode = {version_code}')
          PY

      - name: Compile Android release package
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon

      - name: Sign and verify Android release APK with permanent certificate
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          CF_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          CF_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/capitalflow-release.jks"
          aligned="$RUNNER_TEMP/CapitalFlow-Android-aligned.apk"
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p "$RUNNER_TEMP/capitalflow-signed"
          signed="$RUNNER_TEMP/capitalflow-signed/CapitalFlow-Android.apk"
          trap 'rm -f "$store" "$aligned"' EXIT
          printf '%s' "$CF_KEYSTORE_B64" | base64 --decode > "$store"
          test -s "$unsigned"
          keytool -list -keystore "$store" -storepass:env CF_STORE_PASSWORD -alias "$CF_KEY_ALIAS" >/dev/null

          zipalign="$(find "${ANDROID_HOME:?}/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$zipalign" && test -x "$apksigner"
          "$zipalign" -p -f 4 "$unsigned" "$aligned"
          "$apksigner" sign --ks "$store" --ks-key-alias "$CF_KEY_ALIAS" \
            --ks-pass env:CF_STORE_PASSWORD --key-pass env:CF_KEY_PASSWORD \
            --out "$signed" "$aligned"
          "$apksigner" verify --verbose --print-certs "$signed"
          if "$apksigner" verify --print-certs "$signed" | grep -qi 'CN=Android Debug'; then
            echo '::error::Debug certificate cannot be used for production releases.'
            exit 1
          fi
          "$zipalign" -c 4 "$signed"
          unzip -t -q "$signed" >/dev/null
          (
            cd "$RUNNER_TEMP/capitalflow-signed"
            sha256sum CapitalFlow-Android.apk > CapitalFlow-Android.apk.sha256
          )
          echo 'APK signed with the owner-managed keystore and verified by apksigner.'

      - name: Publish signed Android release at a stable GitHub URL
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-signed-beta"
          cat > "$RUNNER_TEMP/android-signed-notes.md" <<EOF
          CapitalFlow Android — beta assinado com certificado permanente.

          Origem: commit ${GITHUB_SHA}
          Compilacao: ${GITHUB_RUN_NUMBER}

          O APK possui assinatura criptografica de publicacao e verificacao SHA-256.
          A assinatura nao significa aprovacao pela Play Store, Samsung ou Play Protect.
          Aplicativos anteriores com assinatura DEBUG diferente nao podem ser
          atualizados por cima. Faca backup antes de qualquer desinstalacao.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "CapitalFlow Android — beta assinado" --prerelease \
              --notes-file "$RUNNER_TEMP/android-signed-notes.md"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/capitalflow-signed/CapitalFlow-Android.apk" \
            "$RUNNER_TEMP/capitalflow-signed/CapitalFlow-Android.apk.sha256"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "CapitalFlow Android — beta assinado" --prerelease \
            --notes-file "$RUNNER_TEMP/android-signed-notes.md"
