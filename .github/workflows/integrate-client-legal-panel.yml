name: Integrate client legal documents panel

on:
  push:
    paths:
      - '.github/workflows/integrate-client-legal-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch ClientsPage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('pages/ClientsPage.tsx')
          text = path.read_text(encoding='utf-8')

          import_line = "import { ClientLegalDocumentsPanel } from '../features/legal/components/ClientLegalDocumentsPanel';"
          if import_line not in text:
              matches = list(re.finditer(r"^import .*clientPreContract\.service.*;$", text, flags=re.MULTILINE))
              if not matches:
                  raise SystemExit('Import anchor clientPreContract.service not found')
              match = matches[-1]
              text = text[:match.end()] + "\n" + import_line + text[match.end():]

          panel = '''              <div className="px-4 pb-4">
                <ClientLegalDocumentsPanel
                  clientId={selectedClient.id}
                  onNotify={(message, type) => showToast(message, type || 'info')}
                />
              </div>
'''
          footer = '              <footer className="flex flex-wrap justify-end gap-2 border-t border-slate-800 p-4">'
          if '<ClientLegalDocumentsPanel' not in text:
              position = text.find(footer)
              if position < 0:
                  raise SystemExit('Selected client footer anchor not found')
              text = text[:position] + panel + text[position:]

          path.write_text(text, encoding='utf-8')
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "CapitalFlow Automation"
          git config user.email "actions@github.com"
          git add pages/ClientsPage.tsx
          git commit -m "feat: show legal document links and actions on client card"
          git push
