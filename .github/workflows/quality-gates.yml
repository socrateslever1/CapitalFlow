name: Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-finance-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --progress=false
      - run: npm run test:quality

  postgres-transactional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --progress=false
      - name: Install isolated integration-test dependencies
        run: npm install --no-save --package-lock=false @testcontainers/postgresql@12.1.0 pg@8.23.0
      - name: Run PostgreSQL concurrency/idempotency/rollback tests
        env:
          TEST_POSTGRES_IMAGE: postgres:17.6-alpine
        run: npm run test:integration

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --progress=false
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run browser E2E
        run: npm run test:e2e

  load-smoke-and-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --progress=false
      - run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/capitalflow-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/capitalflow-preview.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run load smoke test
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:load
      - name: Run local stress test
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:load:stress
