name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-finance-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          if [ -f package-lock.json ]; then npm ci --progress=false; else npm install --progress=false --no-fund; fi
      - name: Verify wallet invoice and cross-file import regression suite
        run: npm run test:wallet-statement-import
      - name: Verify due-date calculations and invoice editing
        run: npm run test:wallet-invoice-cycle && node --test tests/architecture/wallet-invoice-editor-regression.test.mjs
      - name: Verify issuer invoice facts and financial ledger bridge
        run: node --test tests/architecture/wallet-issuer-invoice-atomic.test.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test:quality

  wallet-functional-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --progress=false
      - name: Run complete quality suite independently of dependency audit
        run: npm run test:quality

  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          if [ -f package-lock.json ]; then npm ci --progress=false; else npm install --progress=false --no-fund; fi
      - run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/capitalflow-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/capitalflow-preview.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run load smoke test
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:load
